nodeLinker: node-modules
npmMinimalAgeGate: 1d
# The collector tracks Lightmill betas as soon as they are published.
npmPreapprovedPackages:
  - '@lightmill/*'

# Versions shared by several workspaces, referenced as `catalog:`.
catalog:
  '@types/node': ^26.4.1
  '@vitest/browser-playwright': ^5.0.0
  playwright: ^1.63.0
  typescript: npm:@typescript/typescript6@^6.0.2
  vite: ^8.2.2
  vitest: ^5.0.0
