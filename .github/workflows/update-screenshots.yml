name: Update browser screenshots

on:
  pull_request_target:
    branches: [main]
    types: [labeled]

concurrency:
  group: update-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event.label.name == 'update screenshots' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup
      - id: update
        continue-on-error: true
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          # `--update` resolves to `all` and rewrites references that are
          # missing or out of tolerance; explicit because `CI=true` in
          # Actions would otherwise resolve it to `none`.
          yarn demo:build
          yarn vitest run --project='browser (chromium)' --update
          yarn vitest run --project='browser (dist)' --update
          # The checkout and pinned container use different owners. Trust only
          # this ephemeral job workspace before asking Git to stage snapshots.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add -- \
            ':(glob)src/**/__tests__/__screenshots__/**' \
            ':(glob)demo/**/__tests__/__screenshots__/**'
          if ! git diff --cached --name-only | awk '
            $0 ~ /^(src|demo)\/(.+\/)?__tests__\/__screenshots__\/.+-chromium-linux\.png$/ { next }
            { exit 1 }
          '; then
            echo 'Only visual PNG baselines may be staged.' >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: Update browser screenshots'
          git push origin "HEAD:${HEAD_REF}"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - if: steps.update.outcome == 'success' && steps.update.outputs.changed == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            // GITHUB_TOKEN-authored pushes do not trigger workflows, so start
            // CI explicitly against the branch after the snapshot commit.
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              ref: context.payload.pull_request.head.ref,
            });
      - if: steps.update.outcome == 'success' && steps.update.outputs.changed == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: 'Updated browser screenshots.',
            });
      - if: steps.update.outcome == 'success' && steps.update.outputs.changed != 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: 'Browser screenshots were unchanged.',
            });
      - if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'update screenshots',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
      - if: steps.update.outcome != 'success'
        run: exit 1

  maintainer-update-required:
    if: >-
      github.event.label.name == 'update screenshots' &&
      (github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: 'A maintainer must update screenshots from a trusted branch.',
            });
      - if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'update screenshots',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
