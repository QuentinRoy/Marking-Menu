name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Keep each pull-request commit's result: an updater commit must not cancel
  # the preceding visual-regression failure that prompted it.
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.head.sha || github.ref
    }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Format:
    name: Format
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: ./.github/actions/setup
      - run: yarn format:check

  LintTypecheck:
    name: Lint and Typecheck
    needs: Build
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: ./.github/actions/setup
      # Lint and typecheck read the declarations in `dist/` (see
      # `demo/tsconfig.json`), so they run the `:only` scripts, which skip the
      # build the plain ones do first.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: yarn lint:only
      - run: yarn typecheck:only

  Test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # The `browser` Vitest project needs a real Chromium; see the `E2E` job's
    # comment for why this image and not a fresh browser install.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: ./.github/actions/setup
      - run: apt-get update && apt-get install -y --no-install-recommends jq
      # Vitest's JSON reporter writes to `.vitest/json/output.json` by
      # default and prints nothing to stdout, so the path is named
      # explicitly; the `default` reporter alongside it keeps the usual
      # console summary in the job log.
      - id: test
        continue-on-error: true
        run: |
          yarn test:coverage --reporter=default --reporter=json --outputFile=test-results.json
      - if: >-
          steps.test.outcome == 'failure' &&
          github.event_name == 'pull_request'
        id: browser
        run: |
          # Only screenshot assertions count as visual failures. A mismatch
          # fails with this exact string; a missing reference or an unstable
          # capture does not, so neither falsely invites an update. Baseline
          # names are extracted separately so a matcher failure is never
          # hidden just because its message carries no parseable name.
          if jq -e '
            [.testResults[].assertionResults[].failureMessages[]?
              | select(contains("Screenshot does not match the stored reference."))
            ] | length > 0
          ' test-results.json > /dev/null; then
            snapshots=$(jq -r '
              [.testResults[].assertionResults[].failureMessages[]?
                | select(contains("Screenshot does not match the stored reference."))
                | scan("[A-Za-z0-9-]+-chromium-linux\\.png")
                | select(test("-(actual|diff)-chromium-linux\\.png$") | not)
              ] | unique[]
            ' test-results.json)
            {
              echo 'failed=true'
              echo 'snapshots<<EOF'
              printf '%s\n' "$snapshots"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi
      - if: steps.browser.outputs.failed == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          SNAPSHOTS: ${{ steps.browser.outputs.snapshots }}
        with:
          script: |
            const updateLabel = 'update screenshots';
            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            };
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: issue.owner,
              repo: issue.repo,
              pull_number: issue.issue_number,
            });
            if (
              pullRequest.head.sha !== context.payload.pull_request.head.sha ||
              pullRequest.labels.some(({ name }) => name === updateLabel)
            ) {
              return;
            }
            const comments = await github.paginate(
              github.rest.issues.listComments,
              issue,
            );
            const heading = 'Visual regression failures detected';
            if (comments.some((comment) => comment.body?.includes(heading))) {
              return;
            }
            const snapshots = process.env.SNAPSHOTS.split('\n')
              .filter(Boolean)
              .map((snapshot) => `- \`${snapshot}\``)
              .join('\n');
            const affected = snapshots === '' ? '' : `\n\n${snapshots}`;
            await github.rest.issues.createComment({
              ...issue,
              body: `### ${heading}${affected}\n\nIf the changes are intentional, add the \`update screenshots\` label to regenerate them.`,
            });
      - if: steps.test.outcome == 'failure'
        run: exit 1

  Build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: ./.github/actions/setup
      # Builds the library (and the assembled demo site) once for the whole
      # workflow; the other jobs download the output they need instead of
      # rebuilding it themselves.
      - run: yarn demo:build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-dist
          path: demo-dist/

  Package:
    needs: Build
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: yarn package:lint
      - run: yarn package:types
      - run: yarn package:smoke-test

  E2E:
    needs: Build
    runs-on: ubuntu-latest
    # The official Playwright image ships the browsers and their system
    # dependencies preinstalled, so the job never has to download them (that
    # step used to hang for tens of minutes when the fetch stalled).
    #
    # This tag has to match the `@playwright/test` version: browsers are
    # pinned per release, so a mismatch makes Playwright fail with "Executable
    # doesn't exist". Renovate groups the two into one PR (see the `playwright`
    # group in renovate.json), so bump them together if you touch either by
    # hand.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: demo-dist
          path: demo-dist/
      # Builds the browser fixture against `dist/`, which the Build job
      # already produced, so this avoids rebuilding the library. The
      # downloaded `demo-dist/` feeds the deployed-demo project below the
      # same way.
      - run: yarn e2e:build
      # Inside the container the job runs as root, but the runner points $HOME
      # at /github/home, which the image's `pwuser` owns. Firefox refuses to
      # launch in that situation ("Running Nightly as root in a regular user's
      # session is not supported"); the other browsers do not care. Overriding
      # HOME here is the workaround Playwright's own error message prescribes.
      # It's set inline rather than as a step-level `env:` because the runner
      # also uses step-level env when invoking the Docker client for this
      # step, and pointing it at /root breaks `docker`'s own config lookup
      # (`/root/.docker/config.json: permission denied`).
      - run: HOME=/root yarn e2e:test
