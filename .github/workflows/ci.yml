name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Keep each pull-request commit's result: an updater commit must not cancel
  # the preceding visual-regression failure that prompted it.
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.head.sha || github.ref
    }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Format:
    name: Format
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: ./.github/actions/setup
      - run: yarn format:check

  LintTypecheck:
    name: Lint and Typecheck
    needs: Build
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: ./.github/actions/setup
      # Lint and typecheck read the declarations in `dist/` (see
      # `demo/tsconfig.json`), so they run the `:only` scripts, which skip the
      # build the plain ones do first.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: yarn lint:only
      - run: yarn typecheck:only

  Test:
    name: Test
    needs: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # The Vitest browser projects need browsers and system dependencies
    # already installed.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: demo-dist
          path: demo-dist/
      - run: apt-get update && apt-get install -y --no-install-recommends jq
      - id: coverage
        continue-on-error: true
        run: |
          yarn test:coverage --reporter=default --reporter=json --outputFile=coverage-results.json
      - id: cross-browser
        continue-on-error: true
        run: |
          HOME=/root yarn test:cross-browser --reporter=default --reporter=json --outputFile=cross-browser-results.json
      - id: dist
        continue-on-error: true
        run: |
          yarn test:dist:only --reporter=default --reporter=json --outputFile=dist-results.json
      - if: >-
          (steps.coverage.outcome == 'failure' ||
          steps.cross-browser.outcome == 'failure' ||
          steps.dist.outcome == 'failure') &&
          github.event_name == 'pull_request'
        id: browser
        run: |
          # Mismatched and missing references can be fixed by the screenshot
          # updater. An unstable capture cannot, so it should not invite an
          # update. Baseline names are extracted separately so a matcher
          # failure is never hidden just because its message has no name.
          if jq -s -e '
            [.[].testResults[].assertionResults[].failureMessages[]?
              | select(
                  contains("Screenshot does not match the stored reference.") or
                  contains("No existing reference screenshot found; a new one was created.")
                )
            ] | length > 0
          ' coverage-results.json cross-browser-results.json dist-results.json > /dev/null; then
            snapshots=$(jq -s -r '
              [.[].testResults[].assertionResults[].failureMessages[]?
                | select(
                    contains("Screenshot does not match the stored reference.") or
                    contains("No existing reference screenshot found; a new one was created.")
                  )
                | scan("[A-Za-z0-9-]+-chromium-linux\\.png")
                | select(test("-(actual|diff)-chromium-linux\\.png$") | not)
              ] | unique[]
            ' coverage-results.json cross-browser-results.json dist-results.json)
            {
              echo 'failed=true'
              echo 'snapshots<<EOF'
              printf '%s\n' "$snapshots"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi
      - if: steps.browser.outputs.failed == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          SNAPSHOTS: ${{ steps.browser.outputs.snapshots }}
        with:
          script: |
            const updateLabel = 'update screenshots';
            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            };
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: issue.owner,
              repo: issue.repo,
              pull_number: issue.issue_number,
            });
            if (
              pullRequest.head.sha !== context.payload.pull_request.head.sha ||
              pullRequest.labels.some(({ name }) => name === updateLabel)
            ) {
              return;
            }
            const comments = await github.paginate(
              github.rest.issues.listComments,
              issue,
            );
            const heading = 'Visual regression failures detected';
            if (comments.some((comment) => comment.body?.includes(heading))) {
              return;
            }
            const snapshots = process.env.SNAPSHOTS.split('\n')
              .filter(Boolean)
              .map((snapshot) => `- \`${snapshot}\``)
              .join('\n');
            const affected = snapshots === '' ? '' : `\n\n${snapshots}`;
            await github.rest.issues.createComment({
              ...issue,
              body: `### ${heading}${affected}\n\nIf the changes are intentional or a reference is missing, add the \`update screenshots\` label to regenerate them.`,
            });
      - if: >-
          steps.coverage.outcome == 'failure' ||
          steps.cross-browser.outcome == 'failure' ||
          steps.dist.outcome == 'failure'
        run: exit 1

  Build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: ./.github/actions/setup
      # Builds the library (and the assembled demo site) once for the whole
      # workflow; the other jobs download the output they need instead of
      # rebuilding it themselves.
      - run: yarn demo:build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-dist
          path: demo-dist/

  Package:
    needs: Build
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: yarn package:lint
      - run: yarn package:types
      - run: yarn package:smoke-test
