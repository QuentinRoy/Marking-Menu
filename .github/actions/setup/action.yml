name: Set up Node and Yarn
description: >-
  Set up Node.js and Corepack, restore the Yarn cache, and run a cache-backed
  immutable install. Shared by every workflow job that needs the workspace's
  dependencies, so the setup only has to be right in one place.

inputs:
  registry-url:
    description: Forwarded to actions/setup-node; only the Release workflow needs it.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # No runner image ships the Node version pinned in `.tool-versions`, so
    # setup-node otherwise downloads it and unpacks it into the tool cache on
    # every job. The unpacking is the slow half, and on `ubuntu-slim` it has
    # taken anywhere from 6 to 48 seconds. Restoring the unpacked tree turns
    # the step into a cache hit.
    - name: Restore Node tool cache
      if: github.event_name != 'pull_request_target'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.tool_cache }}/node
        key: >-
          ${{ runner.os }}-${{ runner.arch }}-node-tool-${{
            hashFiles('.tool-versions')
          }}
    - name: Restore Node tool cache without saving
      if: github.event_name == 'pull_request_target'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.tool_cache }}/node
        key: >-
          ${{ runner.os }}-${{ runner.arch }}-node-tool-${{
            hashFiles('.tool-versions')
          }}
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .tool-versions
        registry-url: ${{ inputs.registry-url }}
        # The explicit `actions/cache` step below owns the Yarn cache. Its
        # key falls back to `<os>-yarn-`, so a lockfile bump still reuses
        # most of the previous cache; setup-node's own caching keys strictly
        # on the lockfile hash and would refetch everything. It also can't
        # find Yarn from here, since corepack provisions it on the next step.
        package-manager-cache: false
    - run: npm install --global corepack@0.36.0
      shell: bash
    - name: Get Yarn cache directory
      id: yarn-cache
      run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Restore Yarn cache
      if: github.event_name != 'pull_request_target'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.yarn-cache.outputs.dir }}
        key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-
    - name: Restore Yarn cache without saving
      if: github.event_name == 'pull_request_target'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.yarn-cache.outputs.dir }}
        key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-
    - run: yarn install --immutable
      shell: bash
