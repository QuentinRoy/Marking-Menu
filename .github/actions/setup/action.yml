name: Set up Node and Yarn
description: >-
  Set up Node.js and Corepack, restore the Yarn cache, and run a cache-backed
  immutable install. Shared by every workflow job that needs the workspace's
  dependencies, so the setup only has to be right in one place.

inputs:
  registry-url:
    description: Forwarded to actions/setup-node; only the Release workflow needs it.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: .tool-versions
        registry-url: ${{ inputs.registry-url }}
    - run: npm install --global corepack
      shell: bash
    - name: Get Yarn cache directory
      id: yarn-cache
      run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Restore Yarn cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.yarn-cache.outputs.dir }}
        key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-
    - run: yarn install --immutable
      shell: bash
